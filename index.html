<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkway IT Assistant</title>
<style>
  :root{
    --brand:#1f4e79; --brand2:#2e75b6; --bg:#eef2f6; --me:#d9fdd3; --bot:#ffffff;
    --text:#1b1b1b; --muted:#6b7280; --danger:#c0392b; --ok:#1e8449;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:var(--bg)}
  header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
  header .logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700}
  header h1{font-size:17px;margin:0}
  header small{opacity:.85;font-size:12px}
  #chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:85%;padding:9px 12px;border-radius:12px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .me{align-self:flex-start;background:var(--me);border-top-right-radius:4px}
  .bot{align-self:flex-end;background:var(--bot);border-top-left-radius:4px}
  .msg img{max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
  .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center}
  .meta button{background:none;border:none;color:var(--brand2);cursor:pointer;font-size:13px;padding:0}
  .actions{align-self:flex-end;display:flex;gap:8px;flex-wrap:wrap}
  .actions button{border:none;border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;color:#fff}
  .yes{background:var(--ok)} .no{background:var(--danger)}
  .typing{align-self:flex-end;color:var(--muted);font-size:13px;padding:4px 8px}
  #preview{display:none;padding:6px 12px;background:#fff;border-top:1px solid #ddd;align-items:center;gap:8px;font-size:13px}
  #preview img{height:48px;border-radius:6px}
  #preview button{margin-inline-start:auto;border:none;background:none;color:var(--danger);font-size:18px;cursor:pointer}
  footer{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f7f7f7;border-top:1px solid #ddd;align-items:flex-end}
  #text{flex:1;resize:none;border:1px solid #ccc;border-radius:20px;padding:10px 14px;font-size:15px;max-height:110px;font-family:inherit}
  .icon{width:44px;height:44px;border-radius:50%;border:none;background:var(--brand2);color:#fff;font-size:20px;cursor:pointer;flex:none;display:grid;place-items:center}
  .icon.light{background:#e3e8ef;color:var(--brand)}
  .icon.rec{background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #recbar{display:none;padding:8px 14px;background:#fdecea;color:var(--danger);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">IT</div>
    <div>
      <h1>Parkway IT Assistant</h1>
      <small id="where">مساعد الدعم الفني — اتكلم، صوّر، أو اكتب مشكلتك</small>
    </div>
  </header>

  <div id="chat"></div>
  <div id="recbar">🔴 بيسجّل… <span id="rectime">0</span> ث — دوس المايك تاني عشان تبعت</div>
  <div id="preview"><img id="previewImg" alt=""><span>صورة جاهزة للإرسال</span><button id="clearImg" title="إلغاء">✕</button></div>

  <footer>
    <button class="icon light" id="camBtn" title="صوّر المشكلة">📷</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <textarea id="text" rows="1" placeholder="اكتب مشكلتك…"></textarea>
    <button class="icon" id="micBtn" title="سجّل فويس">🎤</button>
    <button class="icon" id="sendBtn" title="إرسال" style="display:none">➤</button>
  </footer>
</div>

<script>
/* ======== إعدادات ======== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwmmHZg2jQe0xHtnaCRESf4pdd5l9d-epsgqmAyeeXz06AgA5EvDs5YRwhRcY2jenII/exec';
const MAX_REC_SECONDS = 60;

/* ======== State ======== */
const params = new URLSearchParams(location.search);
const ROOM = params.get('room') || '';
const history = [];
let pendingImage = null, lastImage = null;
let recorder = null, chunks = [], recTimer = null, recSec = 0, busy = false;

const $ = id => document.getElementById(id);
const chat = $('chat'), text = $('text');
if (ROOM) $('where').textContent = 'المكان: ' + ROOM + ' — اتكلم، صوّر، أو اكتب مشكلتك';

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

/* ======== UI helpers ======== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function scroll(){ chat.scrollTop = chat.scrollHeight; }

function addMsg(who, txt, opts={}){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  let html = '';
  if (opts.img) html += '<img src="'+opts.img+'" alt="">';
  if (opts.voice) html += '🎤 <i>فويس</i>' + (txt ? '<br>' : '');
  html += fmt(txt || '');
  d.innerHTML = html;
  if (who === 'bot' && txt && opts.speakable){
    const m = document.createElement('div'); m.className='meta';
    const b = document.createElement('button'); b.textContent='🔊 اسمع الرد';
    b.onclick = () => speak(txt, b); m.appendChild(b); d.appendChild(m);
  }
  chat.appendChild(d); scroll(); return d;
}

/* ======== صوت مصري: Gemini TTS، ولو فشل يرجع لصوت الموبايل ======== */
const audioCache = new Map();
let player = null;
async function speak(t, btn){
  if (player){ player.pause(); player = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const old = btn ? btn.textContent : '';
  try{
    let url = audioCache.get(t);
    if (!url){
      if (btn) btn.textContent = '⏳ بيجهّز الصوت…';
      const a = await api({ action:'tts', text: t });
      url = audioUrl(a.data, a.mime);
      audioCache.set(t, url);
    }
    player = new Audio(url);
    await player.play();
  }catch(e){
    if ('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(t.replace(/\*\*/g,''));
      u.lang = /[\u0600-\u06FF]/.test(t) ? 'ar-EG' : 'en-US';
      speechSynthesis.speak(u);
    }
  }finally{ if (btn) btn.textContent = old; }
}

// Gemini بيرجّع PCM خام، فبنلفّه في WAV عشان المتصفح يشغّله
function audioUrl(b64, mime){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  if (mime && !/L16|pcm/i.test(mime)) return URL.createObjectURL(new Blob([bytes], { type: mime }));
  const rate = parseInt((/rate=(\d+)/.exec(mime||'')||[])[1] || '24000', 10);
  const h = new DataView(new ArrayBuffer(44));
  const w = (o,s) => { for (let i=0;i<s.length;i++) h.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); h.setUint32(4, 36+bytes.length, true); w(8,'WAVE'); w(12,'fmt ');
  h.setUint32(16,16,true); h.setUint16(20,1,true); h.setUint16(22,1,true);
  h.setUint32(24,rate,true); h.setUint32(28,rate*2,true); h.setUint16(32,2,true); h.setUint16(34,16,true);
  w(36,'data'); h.setUint32(40, bytes.length, true);
  return URL.createObjectURL(new Blob([h.buffer, bytes], { type:'audio/wav' }));
}

function typing(on){
  let t = $('typingEl');
  if (on && !t){ t=document.createElement('div'); t.id='typingEl'; t.className='typing'; t.textContent='المساعد بيفكّر…'; chat.appendChild(t); scroll(); }
  if (!on && t) t.remove();
}

function addActions(){
  document.querySelectorAll('.actions').forEach(a=>a.remove());
  const a = document.createElement('div'); a.className='actions';
  a.innerHTML = '<button class="yes">✅ اتحلت</button><button class="no">❌ مش اتحلت – ابعت للـ IT</button>';
  a.querySelector('.yes').onclick = () => { a.remove(); addMsg('bot','تمام 👍 سعيد إن المشكلة اتحلت. لو احتجت أي حاجة تانية أنا موجود.'); };
  a.querySelector('.no').onclick = () => { a.remove(); sendTicket(); };
  chat.appendChild(a); scroll();
}

/* ======== API ======== */
async function api(payload){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) }); // text/plain => no CORS preflight
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function send(message, display){
  if (busy) return; busy = true;
  addMsg('me', display.text, { img: display.img, voice: display.voice });
  typing(true);
  try{
    const res = await api({ action:'chat', room: ROOM, history, message });
    typing(false);
    history.push({ role:'user', text: res.transcript || message.text || '' });
    history.push({ role:'model', text: res.reply });
    addMsg('bot', res.reply, { speakable: true });
    addActions();
  }catch(e){
    typing(false);
    addMsg('bot', '⚠️ حصلت مشكلة في الاتصال: ' + e.message + '\nجرّب تاني بعد شوية.');
  }finally{ busy = false; }
}

async function sendTicket(){
  let name = store('itName') || '';
  name = prompt('اكتب اسمك عشان فريق الـ IT يعرف يوصلك:', name) || '';
  if (!name.trim()){ addActions(); return; }
  store('itName', name.trim());
  typing(true);
  try{
    await api({ action:'ticket', room: ROOM, name: name.trim(), history, image: lastImage });
    typing(false);
    addMsg('bot', '📨 تم إرسال البلاغ لفريق الـ IT ومعاه تفاصيل المحادثة. هيتواصلوا معاك في أقرب وقت.');
  }catch(e){
    typing(false);
    addMsg('bot', '⚠️ معرفتش أبعت البلاغ: ' + e.message);
    addActions();
  }
}

/* ======== Text ======== */
function toggleSend(){ const has = text.value.trim() || pendingImage; $('sendBtn').style.display = has?'grid':'none'; $('micBtn').style.display = has?'none':'grid'; }
text.addEventListener('input', () => { text.style.height='auto'; text.style.height=Math.min(text.scrollHeight,110)+'px'; toggleSend(); });
text.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('sendBtn').click(); } });
$('sendBtn').onclick = () => {
  const t = text.value.trim();
  if (!t && !pendingImage) return;
  const message = { text: t };
  const display = { text: t };
  if (pendingImage){ message.image = pendingImage.payload; display.img = pendingImage.url; lastImage = pendingImage.payload; }
  text.value=''; text.style.height='auto'; clearImage(); toggleSend();
  send(message, display);
};

/* ======== Image ======== */
$('camBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  pendingImage = await compressImage(f);
  $('previewImg').src = pendingImage.url; $('preview').style.display='flex'; toggleSend();
};
$('clearImg').onclick = () => { clearImage(); toggleSend(); };
function clearImage(){ pendingImage=null; $('preview').style.display='none'; }

function compressImage(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280, s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.8);
      res({ url, payload:{ mime:'image/jpeg', data: url.split(',')[1] } });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ======== Voice ======== */
$('micBtn').onclick = async () => {
  if (recorder && recorder.state === 'recording'){ recorder.stop(); return; }
  if (busy) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recTimer); $('recbar').style.display='none'; $('micBtn').classList.remove('rec'); $('micBtn').textContent='🎤';
      if (recSec < 1) return;
      try{
        const wav = await toWav16k(new Blob(chunks, { type: recorder.mimeType }));
        const message = { audio:{ mime:'audio/wav', data: wav } };
        const display = { text:'', voice:true };
        if (pendingImage){ message.image = pendingImage.payload; display.img = pendingImage.url; lastImage = pendingImage.payload; clearImage(); toggleSend(); }
        send(message, display);
      }catch(err){ addMsg('bot','⚠️ معرفتش أقرأ التسجيل، جرّب تاني أو اكتب المشكلة.'); }
    };
    recorder.start(); recSec = 0;
    $('micBtn').classList.add('rec'); $('micBtn').textContent='■'; $('recbar').style.display='block'; $('rectime').textContent='0';
    recTimer = setInterval(() => { recSec++; $('rectime').textContent = recSec; if (recSec >= MAX_REC_SECONDS) recorder.stop(); }, 1000);
  }catch(e){
    addMsg('bot','⚠️ محتاج إذن المايكروفون. اسمح للمتصفح يستخدم المايك وجرّب تاني، أو اكتب مشكلتك.');
  }
};

// يحوّل أي تسجيل (webm / mp4) لـ WAV mono 16kHz عشان Gemini يقبله على كل الموبايلات
async function toWav16k(blob){
  const buf = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const decoded = await new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad));
  ctx.close && ctx.close();
  const rate = 16000, len = Math.ceil(decoded.duration * rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length*2));
  const w = (o,s) => { for (let i=0;i<s.length;i++) out.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); out.setUint32(4, 36+pcm.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
  out.setUint32(24,rate,true); out.setUint32(28,rate*2,true); out.setUint16(32,2,true); out.setUint16(34,16,true);
  w(36,'data'); out.setUint32(40, pcm.length*2, true);
  for (let i=0;i<pcm.length;i++){ const s=Math.max(-1,Math.min(1,pcm[i])); out.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
  const bytes = new Uint8Array(out.buffer); let bin=''; const step=0x8000;
  for (let i=0;i<bytes.length;i+=step) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+step));
  return btoa(bin);
}

/* ======== Welcome ======== */
addMsg('bot', 'أهلاً بيك 👋 أنا مساعد الدعم الفني في Parkway.\nقولّي مشكلتك بأي طريقة تريحك:\n🎤 دوس المايك واتكلم\n📷 صوّر الشاشة أو رسالة الخطأ\n⌨️ أو اكتبها\n\nمن فضلك متقولش أي باسوورد هنا.');
if (API_URL.startsWith('PASTE')) addMsg('bot','⚙️ (للمسؤول) لسه محتاج تحط رابط الـ Web App في API_URL جوه الملف.');
</script>
</body>
</html>
